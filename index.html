<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$2,700 Saving Challenge</title>

<style>
body {
  background:#0d1f5c;
  color:white;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  padding:20px;
}

.card { max-width:400px; width:100%; }

.grid {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:20px 0;
}

.cell {
  padding:10px;
  text-align:center;
  border-radius:10px;
  background:#3399ff;
  cursor:pointer;
}

.cell.checked {
  opacity:0.4;
  position:relative;
}

.cell.checked::after {
  content:"✓";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:20px;
}

.red { background:#ff4444; }
.green { background:#44cc44; }

.progress {
  height:10px;
  background:#222;
  border-radius:20px;
  overflow:hidden;
}

.fill {
  height:100%;
  background:#44cc44;
  width:0%;
}

</style>
</head>

<body>

<div class="card">

<h2>$2,700 Saving Challenge</h2>

<div id="status"></div>
<div id="missed"></div>

<div id="days"></div>

<div class="progress">
  <div id="fill" class="fill"></div>
</div>

<div id="grid" class="grid"></div>

<div id="total"></div>

</div>

<script>

// ===== CONFIG =====
const amounts = [80,75,95,105,60,110,85,60,140,55,85,125,60,100,110,45,100,80,85,90,65,135,55,95,105,50,145,95,85,125];
const START_DATE = new Date('2026-03-14');
const KEY = 'challenge';

// ===== DATA =====
let checked = JSON.parse(localStorage.getItem(KEY)) || new Array(30).fill(false);

// ===== GRID =====
const grid = document.getElementById('grid');

amounts.forEach((amt,i)=>{
  const div = document.createElement('div');
  div.className = 'cell ' + (amt>=100?'red':amt<=50?'green':'');
  div.textContent = "$"+amt;

  if(checked[i]) div.classList.add('checked');

  div.onclick = ()=>{
    checked[i] = !checked[i];
    div.classList.toggle('checked');
    update();
  };

  grid.appendChild(div);
});

// ===== UPDATE =====
function update(){

  const done = checked.filter(x=>x).length;

  // jours écoulés
  const today = new Date();
  today.setHours(0,0,0,0);

  const start = new Date(START_DATE);
  start.setHours(0,0,0,0);

  let daysElapsed = Math.floor((today - start)/(1000*60*60*24)) + 1;

  if(daysElapsed < 0) daysElapsed = 0;
  if(daysElapsed > 30) daysElapsed = 30;

  // ===== LOGIQUE PRINCIPALE =====
  let missed = daysElapsed - done;
  if(missed < 0) missed = 0;

  // ===== STATUS =====
  if(done >= daysElapsed){
    document.getElementById('status').textContent = "✅ Payé aujourd'hui ! Bravo.";
  } else {
    document.getElementById('status').textContent = "❌ Tu as du retard.";
  }

  document.getElementById('missed').textContent = "JOURS MANQUÉS : " + missed;

  // ===== PROGRESS =====
  document.getElementById('days').textContent = done + " / 30 jours";

  const pct = Math.round((done/30)*100);
  document.getElementById('fill').style.width = pct+"%";

  // ===== TOTAL =====
  const total = amounts.reduce((s,a,i)=> checked[i]?s+a:s,0);
  document.getElementById('total').textContent = "$"+total+" économisés";

  localStorage.setItem(KEY, JSON.stringify(checked));
}

update();

</script>

</body>
</html>
